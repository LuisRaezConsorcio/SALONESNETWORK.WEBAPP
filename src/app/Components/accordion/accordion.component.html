<br>
<div class="flex w-full max-h-[100%] flex-col sm:flex-row space-y-2 pt-2 sm:pt-1">


    <div class="relative border-2 h-full border-gray-300 rounded-lg p-2">
        <!-- Contenedor para el título -->
        <div class="absolute -top-3 left-4 bg-white px-2 text-sm font-semibold text-gray-700">
          Asuntos
        </div>
      
        <!-- Contenido dentro del contenedor -->
        <div
          class="grid grid-cols-1 sm:grid-cols-2 h-full lg:grid-cols-3 gap-2 h-full max-h-[calc(100dvh-16.5rem)] overflow-y-scroll pt-2">
          <div *ngFor="let item of menu; let i = index"
            class="flex items-center justify-center bg-gray-100 border border-gray-300 rounded-lg shadow-sm h-[58px] sm:h-[62px] min-w-[148px]">
            <button (click)="toggleMenu(item)"
              class="btn btn-primary h-full w-full text-white font-bold py-2 px-3 rounded-lg text-xs">
              {{ item.id }}: {{ item.nombre }}
            </button>
          </div>
        </div>
      </div>
      
    

    <div class="divider sm:divider-horizontal"></div>

    <div class="flex flex-col space-y-4">
        <!-- Botón arriba del contenedor -->
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn w-full text-left" (click)="toggleDropdown()">
            {{ selectedCountry?.nombre || 'Seleccione un país' }}
          </div>
          <ul *ngIf="dropdownOpen" tabindex="0"
              class="dropdown-content menu bg-base-100 rounded-box z-[1] w-full p-2 shadow mt-2">
            <li *ngFor="let pais of selectedMenu.pais">
              <a (click)="selectCountry(pais)">{{ pais.nombre }}</a>
            </li>
          </ul>
        </div>
      
        <!-- Contenedor principal con título -->
        <div class="relative border-2 border-gray-300 rounded-lg p-2">
          <!-- Título del contenedor -->
          <div class="absolute -top-3 left-4 bg-white px-2 text-sm font-semibold text-gray-700">
            Secciones
          </div>
      
          <!-- Contenido del contenedor -->
          <div
            class="min-w-[320px] sm:min-w-[165px] md:min-w-[328px] w-full rounded-lg overflow-x-hidden overflow-y-scroll max-h-[calc(100dvh-19rem)] flex-grow  pt-2">
            <ng-container *ngIf="selectedMenu">
              <ng-container *ngIf="selectedCountry">
                <ng-container *ngFor="let subMenu of selectedCountry.subMenus">
                  <!-- Submenú con tercer nivel -->
                  <div *ngIf="subMenu.tercerNivel.length > 0" class="collapse collapse-arrow bg-base-200 my-1">
                    <input type="radio" name="my-accordion-2" />
                    <div class="collapse-title text-sm font-medium">{{ subMenu.nombre }}</div>
                    <div class="collapse-content">
                      <ul class="menu bg-base-200 rounded-lg">
                        <li *ngFor="let option of subMenu.tercerNivel">
                          <a [routerLink]="['Mensajes']"
                             (click)="selectTitles(selectedMenu.nombre,selectedMenu.id, selectedCountry.nombre,selectedCountry.id, subMenu.nombre,subMenu.id,option.nombre,option.id)">
                            <span class="font-bold hidden">{{ option.id }}</span>
                            <span class="font-bold">{{ option.nombre }}</span>
                          </a>
                        </li>
                      </ul>
                    </div>
                  </div>
      
                  <!-- Submenú sin tercer nivel -->
                  <div *ngIf="subMenu.tercerNivel.length === 0"
                       class="flex items-center justify-between w-full bg-base-200 my-1 h-[60px] py-2 px-4 rounded-lg">
                    <span class="text-sm font-medium">{{ subMenu.nombre }}</span>
                    <a class="btn btn-primary flex items-center justify-center h-[30px] min-h-[30px] w-[30px] p-0"
                       [routerLink]="['Mensajes']"
                       (click)="selectTitles(selectedMenu.nombre,selectedMenu.id, selectedCountry.nombre,selectedCountry.id, subMenu.nombre,subMenu.id)">
                      <i class="fa-solid fa-up-right-from-square text-xs"></i>
                    </a>
                  </div>
                </ng-container>
              </ng-container>
            </ng-container>
          </div>
        </div>
      </div>
      
</div>
